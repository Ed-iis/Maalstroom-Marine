<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06141f">
  <title>Maalstroom Marine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Maalstroom Marine</h1>
        <p class="subtitle">Boordinformatie</p>
      </div>

      <div id="status" class="status">
        <span class="status__dot"></span>
        <span id="statusText">Wachten op NMEA…</span>
      </div>
    </header>

    <section class="dashboard">
      <article class="card card--position">
        <div class="card__label">Positie</div>

        <div class="coordinate" id="latitude">—</div>
        <div class="coordinate" id="longitude">—</div>

        <div class="decimal-position">
          <span id="latitudeDecimal">—</span>
          <span id="longitudeDecimal">—</span>
        </div>
      </article>

      <article class="card card--depth">
        <div class="card__label">Diepte</div>

        <div class="depth">
          <span id="depthValue">—</span>
          <span class="depth__unit">m</span>
        </div>

        <div class="depth-detail">
          <span>Transducer: <strong id="depthRaw">—</strong></span>
          <span>Offset: <strong id="depthOffset">—</strong></span>
        </div>
      </article>
    </section>

    <footer class="footer">
      <span id="lastUpdate">Nog geen live gegevens ontvangen</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
